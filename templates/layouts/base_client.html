{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ArtisanBois - Découvrez l'artisanat ivoirien authentique et de qualité">
    <meta name="user-authenticated" content="{% if user.is_authenticated %}true{% else %}false{% endif %}">
    <title>{% block title %}Innov-Sourcing OOA{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="icon" href="{% static 'images/logo.jpg' %}" type="image/x-icon">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0c8631ff',
                        secondary: '#D2B48C'
                    },
                    borderRadius: {
                        'none': '0px',
                        'sm': '4px',
                        DEFAULT: '8px',
                        'md': '12px',
                        'lg': '16px',
                        'xl': '20px',
                        '2xl': '24px',
                        '3xl': '32px',
                        'full': '9999px',
                        'button': '8px'
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Remix Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css" />
    
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
        .font-pacifico {
            font-family: 'Pacifico', cursive;
        }
        .glass-effect {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.4);
        }
        .scroll-to-top {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
        }
        .scroll-to-top.show {
            opacity: 1;
            visibility: visible;
        }
        .scroll-to-top:hover {
            transform: translateY(-5px);
        }

        /* Animation du bouton quand ajouté */
        button.added {
        background-color: #22c55e !important; /* vert */
        color: white !important;
        transform: scale(1.05);
        transition: all 0.3s ease;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50">
    
    <!-- Header -->
    {% include "layouts/header_client.html" %}
    
    <!-- Main Content -->
    <main>
        {% block content %}
        <!-- Le contenu des pages sera inséré ici -->
         
        <!-- Scroll to Top Button -->
        <button id="scrollToTop" class="scroll-to-top fixed bottom-8 right-8 z-50 w-12 h-12 glass-effect rounded-full shadow-lg border border-white/30 flex items-center justify-center text-primary hover:text-primary/80 transition-colors" aria-label="Retour en haut">
          <i class="ri-arrow-up-line text-2xl"></i>
      </button>
        {% endblock content %}
    </main>
    
    {% include "layouts/footer.html" %} 
    
     
    <!-- Notifications/Messages -->
    <div class="container-fluid">
        {% include "layouts/_message.html" %}
    </div>
    

    
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    
    <!-- Custom Scripts -->
    <script>
        // Scroll to Top Button
        document.addEventListener('DOMContentLoaded', function() {
            const scrollToTopBtn = document.getElementById('scrollToTop');
            
            // Afficher/masquer le bouton en fonction du scroll
            window.addEventListener('scroll', function() {
                if (window.pageYOffset > 300) {
                    scrollToTopBtn.classList.add('show');
                } else {
                    scrollToTopBtn.classList.remove('show');
                }
            });
            
            // Remonter en haut avec animation fluide
            scrollToTopBtn.addEventListener('click', function() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        });
    </script>
    
        

    <script>
        // Fonction utilitaire Django : récupérer le CSRF token depuis les cookies
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    // Est-ce que ce cookie correspond au nom demandé ?
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');
      </script>
    
       
    
</body>
</html>
