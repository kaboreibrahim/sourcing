{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sourcing - oils of africa">
    <meta name="user-authenticated" content="{% if user.is_authenticated %}true{% else %}false{% endif %}">
    <title>{% block title %}Sourcing - oils of africa {% endblock %}</title>
    
    <!-- Bootstrap CSS (AJOUTÉ) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/spectrum/1.8.1/spectrum.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#52dd168f',
                        secondary: '#eaddcdff'
                    },
                    borderRadius: {
                        'none': '0px',
                        'sm': '4px',
                        DEFAULT: '8px',
                        'md': '12px',
                        'lg': '16px',
                        'xl': '20px',
                        '2xl': '24px',
                        '3xl': '32px',
                        'full': '9999px',
                        'button': '8px'
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Remix Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css" />
    
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
        .font-pacifico {
            font-family: 'Pacifico', cursive;
        }
        .glass-effect {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.4);
        }
        .scroll-to-top {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
        }
        .scroll-to-top.show {
            opacity: 1;
            visibility: visible;
        }
        .scroll-to-top:hover {
            transform: translateY(-5px);
        }

        /* Animation du bouton quand ajouté */
        button.added {
            background-color: #22c55e !important;
            color: white !important;
            transform: scale(1.05);
            transition: all 0.3s ease;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50">
    
    <!-- Header -->
    {% include "layouts/header_fournissuer.html" %}
    
    <!-- Main Content -->
    <main>
        {% block content %}
        <!-- Le contenu des pages sera inséré ici -->
         
        <!-- Scroll to Top Button -->
        <button id="scrollToTop" class="scroll-to-top fixed bottom-8 right-8 z-50 w-12 h-12 glass-effect rounded-full shadow-lg border border-white/30 flex items-center justify-center text-primary hover:text-primary/80 transition-colors" aria-label="Retour en haut">
            <i class="ri-arrow-up-line text-2xl"></i>
        </button>
        {% endblock content %}
    </main>
    
    <!-- Notifications/Messages -->
    <div class="container-fluid">
        {% include "layouts/_message.html" %}
    </div>

    <!-- ====== SCRIPTS - ORDRE IMPORTANT ====== -->
    
    <!-- 1. jQuery (si nécessaire) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    
    <!-- 2. Bootstrap JS (OBLIGATOIRE AVANT LES AUTRES SCRIPTS) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Dans la section head -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Vos autres scripts personnalisés -->
    <!-- 3. Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 4. Spectrum -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spectrum/1.8.1/spectrum.min.js"></script>
    
    <!-- 5. Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- 6. Swiper -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    
    <!-- 7. Script Scroll to Top -->
    <script>
        // Vérifier que Bootstrap est chargé
        if (typeof bootstrap === 'undefined') {
            console.error('Bootstrap JS n\'est pas chargé !');
        } else {
            console.log('Bootstrap chargé avec succès');
        }
        
        // Scroll to top button
        const scrollBtn = document.getElementById('scrollToTop');
        if (scrollBtn) {
            window.addEventListener('scroll', () => {
                if (window.pageYOffset > 300) {
                    scrollBtn.classList.add('show');
                } else {
                    scrollBtn.classList.remove('show');
                }
            });
            
            scrollBtn.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }
    </script>
    
    <!-- 8. Scripts personnalisés des pages -->
    {% block extra_js %}{% endblock %}
    
</body>
</html>
