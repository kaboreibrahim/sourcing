{% extends 'layouts/base.html' %}
{% block content %}
<div class="container-fluid py-4 suppliers-map-container">
    <!-- En-tête minimaliste -->
    <div class="page-header mb-4">
        <h1 class="page-title">Carte des Fournisseurs</h1>
        <p class="page-subtitle">Gérez et visualisez vos fournisseurs</p>
    </div>
    
    <!-- Panneau de contrôle épuré -->
    <div class="control-panel mb-4">
        <div class="row g-3">
            <!-- Filtres -->
            <div class="col-lg-5 col-md-6">
                <div class="control-card">
                    <h6 class="control-title">Filtres</h6>
                    <div class="row g-2">
                        <div class="col-md-6">
                            <label class="form-label">Ville</label>
                            <select id="villeFilter" class="form-select">
                                <option value="">Toutes les villes</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Recherche</label>
                            <input type="text" id="searchFournisseur" class="form-control" 
                                   placeholder="Nom du fournisseur...">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Vue Carte -->
            <div class="col-lg-3 col-md-6">
                <div class="control-card">
                    <h6 class="control-title">Type de carte</h6>
                    <select id="mapStyleSelector" class="form-select">
                        <option value="streets-v12">Plan</option>
                        <option value="satellite-v9">Satellite</option>
                        <option value="light-v11">Clair</option>
                        <option value="dark-v11">Sombre</option>
                    </select>
                </div>
            </div>

            <!-- Statistiques -->
            <div class="col-lg-2 col-md-6">
                <div class="control-card stats-card">
                    <h6 class="control-title">Statistiques</h6>
                    <div class="stats-content">
                        <div class="stat-item">
                            <span class="stat-value" id="totalFournisseurs">0</span>
                            <span class="stat-label">Total</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="visibleFournisseurs">0</span>
                            <span class="stat-label">Visibles</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="col-lg-2 col-md-6">
                <div class="control-card">
                    <h6 class="control-title">Actions</h6>
                    <button id="resetFilters" class="btn btn-reset">
                        Réinitialiser
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Carte -->
    <div class="map-container mb-4">
        <div id="map"></div>
        <div class="map-loading" id="mapLoading">
            <div class="spinner"></div>
            <p>Chargement de la carte...</p>
        </div>
    </div>

    <!-- Liste des fournisseurs -->
    <div class="suppliers-list-section">
        <div class="list-header">
            <h6>Liste des fournisseurs</h6>
            <span class="badge" id="listCount">0</span>
        </div>
        <div class="suppliers-list-container">
            <div id="fournisseursList" class="suppliers-grid"></div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <p>Aucun fournisseur trouvé</p>
            </div>
        </div>
    </div>
</div>

<!-- Inclure Mapbox -->
<link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
<script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>

<style>
/* Variables CSS - Palette douce et neutre */
:root {
    --primary: linear-gradient(90deg, #14b40f, #0a7b06);
    --primary-light: #9ca3af;
    --primary-dark: #4b5563;
    --background: #f9fafb;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text-primary: #111827;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --accent: #8b9dc3;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    --radius: 8px;
    --transition: all 0.2s ease;
}

/* Conteneur principal */
.suppliers-map-container {
    background: var(--background);
    min-height: 100vh;
    padding: 2rem;
}

/* En-tête */
.page-header {
    margin-bottom: 2rem;
}

.page-title {
    font-size: 1.875rem;
    font-weight: 600;
    color: var(--text-primary);
    margin: 0 0 0.5rem 0;
    letter-spacing: -0.025em;
}

.page-subtitle {
    color: var(--text-secondary);
    font-size: 0.95rem;
    margin: 0;
}

/* Cartes de contrôle */
.control-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    height: 100%;
    transition: var(--transition);
}

.control-card:hover {
    box-shadow: var(--shadow);
}

.control-title {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-primary);
    margin: 0 0 1rem 0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

/* Formulaires */
.form-label {
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 0.375rem;
}

.form-select,
.form-control {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.625rem 0.875rem;
    font-size: 0.875rem;
    transition: var(--transition);
    background: var(--surface);
    color: var(--text-primary);
}

.form-select:focus,
.form-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.1);
    outline: none;
}

/* Statistiques */
.stats-card {
    background: var(--surface);
}

.stats-content {
    display: flex;
    gap: 1.5rem;
}

.stat-item {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}

.stat-value {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1;
}

.stat-label {
    font-size: 0.75rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

/* Bouton réinitialiser */
.btn-reset {
    width: 100%;
    padding: 0.625rem;
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.875rem;
    font-weight: 500;
    transition: var(--transition);
    cursor: pointer;
}

.btn-reset:hover {
    background: var(--background);
    border-color: var(--primary);
}

/* Carte */
.map-container {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    height: 600px;
    border: 1px solid var(--border);
}

#map {
    width: 100%;
    height: 100%;
}

.map-loading {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.map-loading p {
    margin-top: 1rem;
    color: var(--text-secondary);
    font-size: 0.875rem;
}

/* Marqueurs */
.marker-custom {
    background: var(--accent);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid var(--surface);
    box-shadow: var(--shadow-lg);
    cursor: pointer;
    transition: var(--transition);
}

.marker-custom:hover {
    transform: scale(1.15);
    box-shadow: 0 8px 12px -2px rgba(0, 0, 0, 0.15);
}

/* Popups */
.mapboxgl-popup-content {
    padding: 1.25rem;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
}

.popup-title {
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 0.75rem;
    color: var(--text-primary);
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
}

.popup-info {
    font-size: 0.875rem;
    line-height: 1.6;
}

.popup-info p {
    margin: 0.5rem 0;
    color: var(--text-secondary);
}

.popup-info strong {
    color: var(--text-primary);
    font-weight: 500;
}

/* Liste des fournisseurs */
.suppliers-list-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
}

.list-header {
    background: var(--background);
    padding: 1rem 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
}

.list-header h6 {
    margin: 0;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-primary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.badge {
    background: var(--primary);
    color: var(--surface);
    padding: 0.25rem 0.625rem;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 500;
}

.suppliers-list-container {
    padding: 1.25rem;
    max-height: 500px;
    overflow-y: auto;
}

.suppliers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
}

.supplier-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    transition: var(--transition);
    cursor: pointer;
}

.supplier-card:hover {
    border-color: var(--primary);
    box-shadow: var(--shadow);
}

.supplier-header {
    display: flex;
    justify-content: space-between;
    align-items: start;
    margin-bottom: 0.75rem;
    gap: 0.75rem;
}

.supplier-name {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-primary);
    margin: 0;
    line-height: 1.4;
}

.supplier-city {
    background: var(--background);
    color: var(--text-secondary);
    padding: 0.25rem 0.625rem;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 500;
    white-space: nowrap;
}

.supplier-contact {
    font-size: 0.875rem;
    color: var(--text-secondary);
    margin: 0.5rem 0 0 0;
}

.supplier-phone {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.375rem;
}

/* État vide */
.empty-state {
    text-align: center;
    padding: 3rem 2rem;
    color: var(--text-muted);
}

.empty-state p {
    font-size: 0.95rem;
    margin: 0;
}

/* Scrollbar */
.suppliers-list-container::-webkit-scrollbar {
    width: 6px;
}

.suppliers-list-container::-webkit-scrollbar-track {
    background: var(--background);
}

.suppliers-list-container::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
}

.suppliers-list-container::-webkit-scrollbar-thumb:hover {
    background: var(--primary-light);
}

/* Responsive */
@media (max-width: 768px) {
    .suppliers-map-container {
        padding: 1rem;
    }

    .page-title {
        font-size: 1.5rem;
    }

    .map-container {
        height: 400px;
    }

    .suppliers-grid {
        grid-template-columns: 1fr;
    }

    .stats-content {
        gap: 1rem;
    }
}

/* Transitions douces */
* {
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}
</style>

<script>
// Configuration Mapbox
mapboxgl.accessToken = 'pk.eyJ1IjoiaWJyYWsiLCJhIjoiY21oYnV4M3M5MDZqMTJyc2E0enFpbTlwaCJ9.OH_RYh--XO3vn363pKRlRg';

let map;
let markers = [];
let allFournisseurs = [];

// Initialiser la carte
function initMap() {
    map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/light-v11',
        center: [-5.5471, 6.8270],
        zoom: 8
    });

    map.addControl(new mapboxgl.NavigationControl(), 'top-right');
    map.addControl(new mapboxgl.FullscreenControl(), 'top-right');

    map.on('load', () => {
        document.getElementById('mapLoading').style.display = 'none';
        loadFournisseurs();
    });
}

// Charger les fournisseurs
async function loadFournisseurs() {
    try {
        const response = await fetch('/api/fournisseurs/');
        const data = await response.json();
        allFournisseurs = data;
        
        displayFournisseurs(allFournisseurs);
        populateFilters(allFournisseurs);
        updateStats(allFournisseurs.length, allFournisseurs.length);
    } catch (error) {
        console.error('Erreur lors du chargement des fournisseurs:', error);
        loadTestData();
    }
}

// Données de test
function loadTestData() {
    allFournisseurs = [
        {
            id: 1,
            nom: "Fournisseur Premium Plus",
            nom_responsable: "Jean Dupont",
            latitude: 6.8270,
            longitude: -5.5471,
            contact: "+225 01 23 45 67 89",
            ville: { nom: "Abidjan" },
            localite: { nom: "Cocody" },
            distance_port_abidjan: 15.5,
            distance_port_sanpedro: 250.0
        },
        {
            id: 2,
            nom: "Solutions Logistics SARL",
            nom_responsable: "Marie Martin",
            latitude: 6.9000,
            longitude: -5.5000,
            contact: "+225 09 87 65 43 21",
            ville: { nom: "Abidjan" },
            localite: { nom: "Plateau" },
            distance_port_abidjan: 5.2,
            distance_port_sanpedro: 245.0
        },
        {
            id: 3,
            nom: "Express Distribution CI",
            nom_responsable: "Paul Kouassi",
            latitude: 6.8500,
            longitude: -5.5200,
            contact: "+225 05 11 22 33 44",
            ville: { nom: "Abidjan" },
            localite: { nom: "Marcory" },
            distance_port_abidjan: 8.3,
            distance_port_sanpedro: 248.0
        }
    ];
    
    displayFournisseurs(allFournisseurs);
    populateFilters(allFournisseurs);
    updateStats(allFournisseurs.length, allFournisseurs.length);
}

// Afficher les fournisseurs sur la carte
function displayFournisseurs(fournisseurs) {
    markers.forEach(marker => marker.remove());
    markers = [];

    const validFournisseurs = fournisseurs.filter(f => 
        f.latitude && f.longitude && 
        !isNaN(f.latitude) && !isNaN(f.longitude)
    );

    if (validFournisseurs.length === 0) {
        document.getElementById('emptyState').style.display = 'flex';
        document.getElementById('fournisseursList').style.display = 'none';
        return;
    }

    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('fournisseursList').style.display = 'grid';

    validFournisseurs.forEach(fournisseur => {
        const el = document.createElement('div');
        el.className = 'marker-custom';

        const popupContent = `
            <div class="popup-title">${fournisseur.nom}</div>
            <div class="popup-info">
                ${fournisseur.nom_responsable ? `<p><strong>Responsable:</strong> ${fournisseur.nom_responsable}</p>` : ''}
                ${fournisseur.contact ? `<p><strong>Contact:</strong> ${fournisseur.contact}</p>` : ''}
                <p><strong>Ville:</strong> ${fournisseur.ville.nom}</p>
                ${fournisseur.localite ? `<p><strong>Localité:</strong> ${fournisseur.localite.nom}</p>` : ''}
                ${fournisseur.distance_port_abidjan ? `<p><strong>Port Abidjan:</strong> ${fournisseur.distance_port_abidjan} km</p>` : ''}
                ${fournisseur.distance_port_sanpedro ? `<p><strong>Port San-Pedro:</strong> ${fournisseur.distance_port_sanpedro} km</p>` : ''}
            </div>
        `;

        const popup = new mapboxgl.Popup({ offset: 25 })
            .setHTML(popupContent);

        const marker = new mapboxgl.Marker(el)
            .setLngLat([fournisseur.longitude, fournisseur.latitude])
            .setPopup(popup)
            .addTo(map);

        markers.push(marker);
    });

    if (validFournisseurs.length > 0) {
        const bounds = new mapboxgl.LngLatBounds();
        validFournisseurs.forEach(f => {
            bounds.extend([f.longitude, f.latitude]);
        });
        map.fitBounds(bounds, { padding: 50 });
    }

    updateFournisseursList(validFournisseurs);
    updateStats(allFournisseurs.length, validFournisseurs.length);
}

// Mettre à jour la liste des fournisseurs
function updateFournisseursList(fournisseurs) {
    const listContainer = document.getElementById('fournisseursList');
    listContainer.innerHTML = '';

    fournisseurs.forEach((fournisseur, index) => {
        const card = document.createElement('div');
        card.className = 'supplier-card';
        card.innerHTML = `
            <div class="supplier-header">
                <h6 class="supplier-name">${fournisseur.nom}</h6>
                <span class="supplier-city">${fournisseur.ville.nom}</span>
            </div>
            <p class="supplier-contact">${fournisseur.nom_responsable || 'Non renseigné'}</p>
            ${fournisseur.contact ? `<div class="supplier-phone">${fournisseur.contact}</div>` : ''}
        `;
        
        card.addEventListener('click', () => {
            map.flyTo({
                center: [fournisseur.longitude, fournisseur.latitude],
                zoom: 14,
                essential: true
            });
            
            setTimeout(() => {
                if (markers[index]) {
                    markers[index].togglePopup();
                }
            }, 1000);
        });

        listContainer.appendChild(card);
    });

    document.getElementById('listCount').textContent = `${fournisseurs.length}`;
}

// Peupler les filtres
function populateFilters(fournisseurs) {
    const villeSelect = document.getElementById('villeFilter');
    const villes = [...new Set(fournisseurs.map(f => f.ville.nom))].sort();
    
    villes.forEach(ville => {
        const option = document.createElement('option');
        option.value = ville;
        option.textContent = ville;
        villeSelect.appendChild(option);
    });
}

// Filtrer les fournisseurs
function filterFournisseurs() {
    const villeFilter = document.getElementById('villeFilter').value;
    const searchTerm = document.getElementById('searchFournisseur').value.toLowerCase();

    let filtered = allFournisseurs;

    if (villeFilter) {
        filtered = filtered.filter(f => f.ville.nom === villeFilter);
    }

    if (searchTerm) {
        filtered = filtered.filter(f => 
            f.nom.toLowerCase().includes(searchTerm) ||
            (f.nom_responsable && f.nom_responsable.toLowerCase().includes(searchTerm))
        );
    }

    displayFournisseurs(filtered);
}

// Mettre à jour les statistiques
function updateStats(total, visible) {
    document.getElementById('totalFournisseurs').textContent = total;
    document.getElementById('visibleFournisseurs').textContent = visible;
}

// Event listeners
document.addEventListener('DOMContentLoaded', function() {
    initMap();

    document.getElementById('mapStyleSelector').addEventListener('change', function(e) {
        const style = e.target.value;
        map.setStyle(`mapbox://styles/mapbox/${style}`);
        
        map.once('style.load', function() {
            displayFournisseurs(allFournisseurs.filter(f => {
                const villeFilter = document.getElementById('villeFilter').value;
                const searchTerm = document.getElementById('searchFournisseur').value.toLowerCase();
                
                let matches = true;
                if (villeFilter) matches = matches && f.ville.nom === villeFilter;
                if (searchTerm) matches = matches && (
                    f.nom.toLowerCase().includes(searchTerm) ||
                    (f.nom_responsable && f.nom_responsable.toLowerCase().includes(searchTerm))
                );
                return matches;
            }));
        });
    });

    document.getElementById('villeFilter').addEventListener('change', filterFournisseurs);
    document.getElementById('searchFournisseur').addEventListener('input', filterFournisseurs);
    
    document.getElementById('resetFilters').addEventListener('click', function() {
        document.getElementById('villeFilter').value = '';
        document.getElementById('searchFournisseur').value = '';
        displayFournisseurs(allFournisseurs);
    });
});
</script>

{% endblock %}
