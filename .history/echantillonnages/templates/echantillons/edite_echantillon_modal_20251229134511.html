 
<!-- Modal de modification -->
<div class="modal fade" id="editEchantillonModal" tabindex="-1" aria-labelledby="editEchantillonModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editEchantillonModalLabel">
          <i class="fas fa-edit"></i> Modifier l'échantillon
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="edit-echantillon-form" method="post" action="">
        {% csrf_token %}
        <div class="modal-body">
          <input type="hidden" name="echantillon_id" id="echantillon_id">
          <div class="mb-3">
            <label for="edit_quantite" class="form-label">Quantité (T)</label>
            <input type="number" step="0.01" min="0" class="form-control" id="edit_quantite" name="quantite" required>
          </div>
          <div class="mb-3">
            <label for="edit_prix" class="form-label">Prix (FCFA/T)</label>
            <input type="number" step="0.01" min="0" class="form-control" id="edit_prix" name="prix" required>
          </div>
          <!-- Remplacer le champ de date par : -->
          <div class="mb-3">
            <label for="edit_date_creation" class="form-label">Date</label>
            <input type="datetime-local" class="form-control" id="edit_date_creation" 
                  name="date_creation" required 
                  value="{{ form.instance.date_creation|date:'Y-m-d\TH:i' }}">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            <i class="fas fa-times"></i> Annuler
          </button>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Enregistrer
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
